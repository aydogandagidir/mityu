name: ci
on:
  workflow_call: {}
  push: { branches: [ main, "feat/**", "fix/**", "chore/**", "docs/**" ] }
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    # Decides whether this PR touches anything a Windows compile could break.
    # Fails toward building: only a PR whose EVERY changed file is documentation
    # or the landing site skips the Windows build. Runs on the PR merge commit,
    # so HEAD^1 is the base tip and the diff is exactly this PR's effect.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.classify.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          native=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|landing/*|.claude/*|*.md|LICENSE) ;;
              *) native=true; echo "native: $f" ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "windows build needed: $native"
  windows-build:
    # The full Windows release build on every pull request that touches
    # anything native. Added after v1.2.1 shipped with `tauri-plugin-log`
    # declared only for macOS: `cargo test --all` on ubuntu cannot see a
    # Windows-only compile or link problem, and every Windows build workflow
    # was manual — and, until ADR-0048, could not start at all. This is not a
    # smoke test (CLAUDE.md §4 still requires one), but the installer it
    # uploads is what the smoke test installs: artifact
    # `mityu-pr-x86_64-pc-windows-msvc`, holding the .msi and the NSIS .exe.
    #
    # `pull_request` only: release.yml calls this file as its gate, and a
    # release must not build Windows twice. A fork PR gets a read-only token
    # and no secrets; this job needs neither (sign-binaries: false — the only
    # secrets build.yml reads sit behind that switch). A newer push to the
    # same PR cancels the build in flight.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.native == 'true'
    permissions:
      contents: read
    concurrency:
      group: ci-windows-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      sign-binaries: false
      asset-prefix: "mityu-pr"
      upload-artifacts: true
      is-debug-build: false
    secrets: inherit
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { components: "rustfmt, clippy" }
      - name: fmt
        run: cargo fmt --all --check
      - name: install native dependencies (Tauri/audio — mirrors build.yml's ubuntu list, unpinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: ". -> target" }
      - name: build llama-helper sidecar (tauri-build fails without binaries/llama-helper-<target>)
        run: |
          cargo build -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/debug/llama-helper "frontend/src-tauri/binaries/llama-helper-$(rustc -vV | grep 'host:' | awk '{print $2}')"
      - name: build diarize-helper sidecar (tauri-build fails without binaries/diarize-helper-<target>)
        # The bootstrap MUST run first. `sherpa-onnx-sys` fetches a ~22 MB
        # prebuilt native archive with no integrity check of any kind, and its
        # build script runs before any of ours — so verification has to happen
        # outside cargo (ADR-0035 §4). It fails closed on a bad digest, a wrong
        # size, or an unpinned target, and `--github-env` exports the verified
        # directory for every later cargo step in this job.
        run: |
          python3 tools/diarization/fetch-sherpa-archive.py --github-env
          cargo build -p diarize-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/debug/diarize-helper "frontend/src-tauri/binaries/diarize-helper-$(rustc -vV | grep 'host:' | awk '{print $2}')"
      - name: the sidecar carries no GPL-3.0 espeak-ng
        # One line away from silently reverting: bump the crate or repoint a pin
        # and upstream's TTS-on archive comes back, taking GPL-3.0 espeak-ng
        # into a binary we ship closed. It was measured at 51 symbols in a
        # RELEASE build before the fix -- /OPT:REF did not strip it (H10).
        # --self-test first, because a detector nobody has seen fail is
        # indistinguishable from one that cannot.
        run: |
          python3 tools/diarization/check-no-gpl-espeak.py --self-test
          python3 tools/diarization/check-no-gpl-espeak.py target/debug/diarize-helper
      - name: clippy
        # Warnings are advisory until the ~140-warning upstream baseline is burned
        # down (ADR-0017); deny-by-default correctness lints still fail the job.
        run: cargo clippy --all-targets
      - name: test
        run: cargo test --all
      - name: the app starts and writes exactly one log file
        # The ONLY check in this repo that can see a capability silently ABSENT
        # at runtime. v1.2.1 shipped with tauri-plugin-log declared under
        # `[target.'cfg(target_os = "macos")'.dependencies]`, so Windows linked
        # no log crate and wrote no file — and nothing caught it, because a
        # plugin you never registered is not a compile error and `cargo test`
        # only ever ran on ubuntu. Starting the program and looking is the only
        # thing that finds this class of defect.
        #
        # It also pins the shape of the fix: `Builder::new().target(x).target(y)`
        # APPENDS to the two targets the builder already carries, which shipped
        # two byte-identical log files and halved the effective rotation
        # ceiling. Asserting exactly one file is what keeps that from returning.
        #
        # This runs on ubuntu, so it does NOT prove the Windows build logs — only
        # that the dependency is no longer macOS-gated and the registration
        # works off macOS. It proves nothing about recording: there is no audio
        # device on a runner, and CLAUDE.md §4 still owes a human smoke test.
        run: |
          sudo apt-get install -y xvfb
          cargo build -p mityu
          tools/ci/verify-startup.sh
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        # Keep release CI on the exact frontend toolchain used by build.yml.
        with: { version: 10.33.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 20.19.4, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - name: test privacy-minimised landing form
        run: npm --prefix ../landing test
  workflow-pins:
    # Every action must be pinned to a commit sha AND run on a live Node runtime.
    # This exists because the v1.2.0 Release run still warned about Node 20 after
    # #40 had "fixed" it — build.yml was deferred, and one offender was a floating
    # `actions/cache@v4` nested INSIDE a third-party composite, invisible to any
    # grep over our own files. The script opens composites and checks what they
    # pull in. `--self-test` runs first: a detector nobody has seen fail is
    # indistinguishable from one that cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: action pins are shas on node24 (and so are the actions they nest)
        run: |
          python3 tools/ci/check-action-pins.py --self-test
          python3 tools/ci/check-action-pins.py
  server-isolation:
    # Enable once server/ exists (Phase 2). Fails the build if the cross-tenant test is missing.
    # hashFiles() is steps-context only (evaluated on the runner): a job-level `if` using it
    # fails GitHub's workflow validation and kills the WHOLE file — guard the step instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cross-tenant isolation test present & passing
        if: ${{ hashFiles('server/**') != '' }}
        run: |
          test -n "$(find server -iname '*cross_tenant*')" || (echo "Missing mandatory cross-tenant isolation test" && exit 1)
          echo "Run the server test suite here (cargo test / pytest) including cross_tenant_isolation_test."
